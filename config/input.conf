# ==============================================================================
# BiliYTPlayer — mpv 快捷键配置
# ==============================================================================

# ── 播放控制 ──────────────────────────────────────────────────────────────────
SPACE       cycle pause
LEFT        seek -5
RIGHT       seek 5
UP          add volume 5
DOWN        add volume -5
m           cycle mute
[           add speed -0.1
]           add speed 0.1
{           add speed -0.5
}           add speed 0.5
BS          set speed 1.0

# ── 字幕 ──────────────────────────────────────────────────────────────────────
v           cycle sub-visibility
j           cycle sub
J           cycle sub down

# ── 音轨 ──────────────────────────────────────────────────────────────────────
a           cycle audio
# 如果播放杜比全景声，按 # 切换立体声降混
#           cycle-values ao wasapi wasapi:stereo

# ── 画面 ──────────────────────────────────────────────────────────────────────
f           cycle fullscreen
A           cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1"
d           cycle deband

# ── OSD 信息 ──────────────────────────────────────────────────────────────────
i           script-binding stats/display-stats
I           script-binding stats/display-stats-toggle
`           script-binding stats/display-page-2
TAB         script-binding stats/display-page-1

# ── 截图 ──────────────────────────────────────────────────────────────────────
s           screenshot
S           screenshot each-frame

# ── 广告跳过（BilibiliSponsorBlock）───────────────────────────────────────────
# 仅在当前视频有片段数据时生效（由 BiliYTPlayer 注入 bsponsor.lua）。
# 注意：Enter 撤销由脚本用 add_forced_key_binding 无条件接管，无需在此绑定，
#       且它一定会覆盖 mpv 内置的 ENTER=playlist-next。
n           script-binding bsponsor/skip-next
N           script-binding bsponsor/toggle

# ── 列表/导航 ─────────────────────────────────────────────────────────────────
q           quit
Q           quit-watch-later
