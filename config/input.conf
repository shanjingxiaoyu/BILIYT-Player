# ==============================================================================
# BiliYTPlayer — mpv 快捷键配置
# ==============================================================================

# ── 鼠标（由 scripts/click-handler.lua 接管）──────────────────────────────────
# 左键单击 = 暂停/播放（300ms 防抖）；左键双击 = 全屏；右键 = mpv 内置菜单

# ── 播放控制 ─
SPACE       cycle pause
LEFT        seek -5
# RIGHT 短按=内置默认绑定快进+5s；长按=2.0x 倍速（scripts/click-handler.lua）
# 注意：此处不要加任何 RIGHT 绑定，否则会屏蔽脚本的按下/抬起事件
UP          add volume 5
DOWN        add volume -5
m           cycle mute
[           add speed -0.1
]           add speed 0.1
{           add speed -0.5
}           add speed 0.5
BS          set speed 1.0

# ── 字幕 ──────────────────────────────────────────────────────────────────────
v           cycle sub-visibility
j           cycle sub
J           cycle sub down

# ── 音轨 ──────────────────────────────────────────────────────────────────────
a           cycle audio
# 如果播放杜比全景声，按 # 切换立体声降混
#           cycle-values ao wasapi wasapi:stereo

# ── 画面 ──────────────────────────────────────────────────────────────────────
f           cycle fullscreen
A           cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1"
d           cycle deband

# ── OSD 信息 ──────────────────────────────────────────────────────────────────
i           script-binding stats/display-stats
I           script-binding stats/display-stats-toggle
`           script-binding stats/display-page-2
TAB         script-binding stats/display-page-1

# ── 截图 ──────────────────────────────────────────────────────────────────────
s           screenshot
S           screenshot each-frame

# ── 列表/导航 ─────────────────────────────────────────────────────────────────
q           quit
Q           quit-watch-later
