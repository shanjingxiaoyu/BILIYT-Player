; CB-to-MPV 配置模板
; GitHub Actions 发布时会把本文件复制成发布包里的 config.ini。
; 仓库中不含 config.ini（本机运行时配置，已 gitignore）；程序在自身目录
; 找不到 config.ini 时全部走内置默认值，所以本文件只是用户改配置的入口。
; 需要自定义时复制一份改名即可：copy config.template.ini config.ini

[paths]
; 手动指定 mpv.exe 路径（可选，程序会自动探测）
; mpv_path = C:\path\to\mpv.exe
; ytdlp_path = C:\path\to\yt-dlp.exe
; cookies_file = C:\path\to\cookies.txt

[network]
; 代理地址（YouTube 需要）
; proxy = http://127.0.0.1:7890

[cookies]
; 浏览器 Cookie（推荐，无需手动导出文件）
; 填入浏览器名称：chrome / edge / firefox / brave / opera
; browser_cookie = edge
browser_cookie =

[app]
; 开机自启（设为 true 则将快捷方式放入启动文件夹，需以 CB-to-MPV.exe 方式运行）
autostart = false
