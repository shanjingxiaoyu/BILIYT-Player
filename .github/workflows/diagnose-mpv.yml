name: Diagnose mpv download

# 临时工作流：release job 在"下载 mpv"这步拿到 104 KB 的非 7z 内容，
# 而本机访问 sourceforge 一律 403，只能在 runner 上问清楚返回了什么。
# 用完就删。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 固定 URL 到底返回什么
        shell: pwsh
        run: |
          $u = "https://sourceforge.net/projects/mpv-player-windows/files/64bit-v3/mpv-x86_64-v3-20250223.7z/download"
          try {
            $r = Invoke-WebRequest -Uri $u -OutFile probe.bin -PassThru
            Write-Host "status=$($r.StatusCode) type=$($r.Headers['Content-Type']) len=$($r.Headers['Content-Length'])"
          } catch {
            Write-Host "抛错: $($_.Exception.GetType().Name) :: $($_.Exception.Message)"
          }
          Write-Host "落盘字节数: $((Get-Item probe.bin -ErrorAction SilentlyContinue).Length)"

      - name: 检查落盘内容是不是 7z
        shell: python
        run: |
          import os, re
          p = "probe.bin"
          if not os.path.exists(p):
              print("没有落盘文件"); raise SystemExit(0)
          raw = open(p, "rb").read()
          print("bytes:", len(raw), " magic7z:", raw[:6] == b"7z\xbc\xaf\x27\x1c")
          txt = raw.decode("utf-8", "replace")
          t = re.search(r"<title>(.*?)</title>", txt, re.S)
          print("title:", repr(t.group(1).strip()[:200]) if t else "(无 title)")
          for h in re.findall(r"<h[12][^>]*>(.*?)</h[12]>", txt, re.S)[:6]:
              print("h:", re.sub(r"<.*?>", "", h).strip()[:160])
          print("开头:", repr(raw[:120]))

      - name: 列出 64bit-v3 现存的文件名
        shell: python
        run: |
          import re, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                              "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"}
          urls = ["https://sourceforge.net/rest/p/mpv-player-windows/files/64bit-v3/",
                  "https://sourceforge.net/projects/mpv-player-windows/files/64bit-v3/",
                  "https://master.dl.sourceforge.net/project/mpv-player-windows/64bit-v3/"
                  "mpv-x86_64-v3-20250223.7z"]
          for url in urls:
              try:
                  req = urllib.request.Request(url, headers=UA)
                  if "master.dl" in url:
                      req.add_header("Range", "bytes=0-15")
                  raw = urllib.request.urlopen(req, timeout=45).read()
                  names = sorted(set(re.findall(rb"mpv-x86_64-v3-\d{8}", raw)))
                  print(f"{url[:70]}…  ->  {len(raw)} bytes, 命中 {len(names)} 个")
                  for n in names[-10:]:
                      print("    ", n.decode())
                  if "master.dl" in url:
                      print("     前 16 字节:", raw[:16])
              except Exception as e:
                  print(f"{url[:70]}…  FAIL {type(e).__name__} {getattr(e, 'code', str(e)[:80])}")
