name: CI & Release

on:
  push:
    branches: [main, cb-player]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  # 手动触发跑的是同一条 release 流水线，但最后一步不发版：
  # 用它来验下载源、打包、发布目录完整性，不必为此先发布一个公开 Release
  workflow_dispatch:

jobs:
  # ── CI: 语法检查（push 到 main / cb-player，或 PR 到 main 时触发） ──
  # 第三方依赖只有 qrcode（画二维码矩阵用），见 requirements.txt
  lint:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 语法检查
        run: |
          python -m py_compile cb_to_mpv.pyw
          echo "All syntax checks passed."

      # 硬约束：Cookie 的值不许进 cb_to_mpv.log。测试自带桩件，不联网、不装依赖
      - name: Cookie 泄漏 canary 测试
        run: python test_cookie_canary.py

      # 打包后没有控制台，重复启动的提示只能靠原生对话框；这里盯它真的被调
      - name: 单实例提示测试
        run: python test_single_instance.py

  # ── Release: 推 tag 时自动打包 EXE + 发布；手动触发只打包不发版 ──
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PyInstaller 与运行依赖
        run: pip install pyinstaller -r requirements.txt

      - name: 打包 EXE
        env:
          SAFE_DELETE_DISABLE: "1"
        run: python -m PyInstaller --noconfirm cb_to_mpv.spec

      - name: 取 mpv 的 7z（官方指 GitHub 构建，按 latest release 选资产并校验签名）
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          # mpv.io/installation 上 Windows 只有 GitHub 构建，SourceForge 那条线已不可用：
          # 钉死的包名会被清理，而 SourceForge 对任何路径都回 JS 渲染的目录页（带浏览器 UA 直接 403），
          # 把那份 104 KB HTML 交给 7z 就是 "Is not archive"。
          # 所以这里只钉「latest release 里形如 mpv-x86_64-<日期> 的资产」，不钉文件名。
          # 取基线 x86_64 而不是 v3：v3 要 AVX2，发布包得能在老机器上跑。
          $repo = "zhongfly/mpv-winbuild"
          $hdr = @{}
          if ($env:GH_TOKEN) { $hdr["Authorization"] = "Bearer $env:GH_TOKEN" }
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/latest" -Headers $hdr -TimeoutSec 120
          Write-Host "TAG $($rel.tag_name)  published $($rel.published_at)"
          $assets = @($rel.assets | Where-Object { $_.name -match '^mpv-x86_64-\d{8}' } | Sort-Object name -Descending)
          Write-Host "MATCHED $($assets.Count) -> $(($assets.name) -join ', ')"
          if (-not $assets) { Write-Error "no x86_64 mpv asset in $repo latest release"; exit 1 }
          $dst = Join-Path $PWD "mpv.7z"
          Invoke-WebRequest -Uri $assets[0].browser_download_url -OutFile $dst -TimeoutSec 900
          # 只认 7z 签名：下载源哪天再变成 HTML，就在这里停下，而不是让解包步骤去猜
          $fi = Get-Item $dst
          $magic = (Get-Content $fi.FullName -AsByteStream -TotalCount 6) -join ','
          Write-Host "SAVED $($assets[0].name)  len=$($fi.Length)  magic=$magic"
          if ($magic -ne "55,122,188,175,39,28" -or $fi.Length -lt 1MB) { Write-Error "mpv.7z is not a 7z archive"; exit 1 }

      - name: 解包 mpv + 取 yt-dlp + 便携配置
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\CB-to-MPV\mpv-portable | Out-Null
          7z x mpv.7z -orelease\CB-to-MPV\mpv-portable -y
          Remove-Item mpv.7z
          # yt-dlp.exe（B 站 / YouTube 解析必需）
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile release\CB-to-MPV\mpv-portable\yt-dlp.exe
          # 便携 mpv 配置
          Copy-Item -Recurse mpv-portable\portable_config release\CB-to-MPV\mpv-portable\

      - name: 整理发布目录
        shell: pwsh
        run: |
          Copy-Item dist\CB-to-MPV.exe release\CB-to-MPV\
          # config.template.ini 是仓库内的配置模板，发布时改名为程序实际读取的 config.ini
          Copy-Item config.template.ini release\CB-to-MPV\config.ini
          # cookies.template.txt 是仓库内的空模板，发布时改名为程序实际读取的 cookies.txt
          Copy-Item cookies.template.txt release\CB-to-MPV\cookies.txt
          Copy-Item README.md release\CB-to-MPV\
          Copy-Item LICENSE release\CB-to-MPV\

      - name: 校验发布目录完整性
        shell: pwsh
        run: |
          $required = @(
            "release\CB-to-MPV\CB-to-MPV.exe",
            "release\CB-to-MPV\config.ini",
            "release\CB-to-MPV\cookies.txt",
            "release\CB-to-MPV\README.md",
            "release\CB-to-MPV\mpv-portable\mpv.exe",
            "release\CB-to-MPV\mpv-portable\yt-dlp.exe",
            "release\CB-to-MPV\mpv-portable\portable_config\mpv.conf",
            "release\CB-to-MPV\mpv-portable\portable_config\input.conf"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error "发布包缺少文件: $($missing -join ', ')"; exit 1 }
          Write-Host "发布包完整性校验通过 ($($required.Count) 项)"

      - name: 打包 zip
        run: Compress-Archive -Path release\CB-to-MPV\* -DestinationPath release\CB-to-MPV.zip

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          files: release/CB-to-MPV.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
