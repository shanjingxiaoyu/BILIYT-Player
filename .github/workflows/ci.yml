name: CI & Release

on:
  push:
    branches: [main, cb-player]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  # 手动触发跑的是同一条 release 流水线，但最后一步不发版：
  # 用它来验下载源、打包、发布目录完整性，不必为此先发布一个公开 Release
  workflow_dispatch:

jobs:
  # ── CI: 语法检查（push 到 main / cb-player，或 PR 到 main 时触发） ──
  # 第三方依赖只有 qrcode（画二维码矩阵用），见 requirements.txt
  lint:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 语法检查
        run: |
          python -m py_compile cb_to_mpv.pyw
          echo "All syntax checks passed."

      # 硬约束：Cookie 的值不许进 cb_to_mpv.log。测试自带桩件，不联网、不装依赖
      - name: Cookie 泄漏 canary 测试
        run: python test_cookie_canary.py

      # 打包后没有控制台，重复启动的提示只能靠原生对话框；这里盯它真的被调
      - name: 单实例提示测试
        run: python test_single_instance.py

  # ── Release: 推 tag 时自动打包 EXE + 发布；手动触发只打包不发版 ──
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PyInstaller 与运行依赖
        run: pip install pyinstaller -r requirements.txt

      - name: 打包 EXE
        env:
          SAFE_DELETE_DISABLE: "1"
        run: python -m PyInstaller --noconfirm cb_to_mpv.spec

      - name: 取 mpv 的 7z（校验签名，固定包失效就回目录挑最新）
        shell: python
        run: |
          import re, sys, urllib.request

          FOLDER = "https://sourceforge.net/projects/mpv-player-windows/files/64bit-v3/"
          PINNED = "mpv-x86_64-v3-20250223.7z"
          # SourceForge 对非浏览器 UA 会发下载中转页，也可能因为包被清理而返回 HTML；
          # 2026-10-08 那次 release job 就拿到了 104 KB 的 HTML，7z 报 Is not archive。
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                              "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"}
          MAGIC = b"7z\xbc\xaf\x27\x1c"


          def fetch(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=180).read()


          def try_name(name):
              try:
                  data = fetch(FOLDER + name + "/download")
              except Exception as e:
                  print(f"::warning::{name} 下载失败 {type(e).__name__} {e}")
                  return None
              if data[:6] != MAGIC:
                  t = re.search(rb"<title>(.*?)</title>", data[:8000], re.S)
                  print(f"::warning::{name} 拿到的不是 7z：{len(data)} 字节，"
                        f"title={t.group(1).decode('utf-8', 'replace')[:90] if t else '无'}")
                  return None
              print(f"{name}：{len(data)} 字节，7z 签名正确")
              return data


          data = try_name(PINNED)
          if data is None:
              found = set()
              for page in (FOLDER,
                           "https://sourceforge.net/rest/p/mpv-player-windows/files/64bit-v3/"):
                  try:
                      txt = fetch(page).decode("utf-8", "replace")
                  except Exception as e:
                      print(f"::warning::目录页 {page} 取不到 {type(e).__name__} {e}")
                      continue
                  found |= set(re.findall(r"mpv-x86_64-v3-\d{8}", txt))
              print("目录里现存：", sorted(found)[-12:] or "一个都没匹配到")
              for name in sorted(found, reverse=True)[:6]:
                  data = try_name(name + ".7z")
                  if data:
                      print("改用", name)
                      break
          if not data:
              sys.exit("拿不到可用的 mpv 7z —— 下载源需要重新确认")
          open("mpv.7z", "wb").write(data)

      - name: 解包 mpv + 取 yt-dlp + 便携配置
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\CB-to-MPV\mpv-portable | Out-Null
          7z x mpv.7z -orelease\CB-to-MPV\mpv-portable -y
          Remove-Item mpv.7z
          # yt-dlp.exe（B 站 / YouTube 解析必需）
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile release\CB-to-MPV\mpv-portable\yt-dlp.exe
          # 便携 mpv 配置
          Copy-Item -Recurse mpv-portable\portable_config release\CB-to-MPV\mpv-portable\

      - name: 整理发布目录
        shell: pwsh
        run: |
          Copy-Item dist\CB-to-MPV.exe release\CB-to-MPV\
          # config.template.ini 是仓库内的配置模板，发布时改名为程序实际读取的 config.ini
          Copy-Item config.template.ini release\CB-to-MPV\config.ini
          # cookies.template.txt 是仓库内的空模板，发布时改名为程序实际读取的 cookies.txt
          Copy-Item cookies.template.txt release\CB-to-MPV\cookies.txt
          Copy-Item README.md release\CB-to-MPV\
          Copy-Item LICENSE release\CB-to-MPV\

      - name: 校验发布目录完整性
        shell: pwsh
        run: |
          $required = @(
            "release\CB-to-MPV\CB-to-MPV.exe",
            "release\CB-to-MPV\config.ini",
            "release\CB-to-MPV\cookies.txt",
            "release\CB-to-MPV\README.md",
            "release\CB-to-MPV\mpv-portable\mpv.exe",
            "release\CB-to-MPV\mpv-portable\yt-dlp.exe",
            "release\CB-to-MPV\mpv-portable\portable_config\mpv.conf",
            "release\CB-to-MPV\mpv-portable\portable_config\input.conf"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error "发布包缺少文件: $($missing -join ', ')"; exit 1 }
          Write-Host "发布包完整性校验通过 ($($required.Count) 项)"

      - name: 打包 zip
        run: Compress-Archive -Path release\CB-to-MPV\* -DestinationPath release\CB-to-MPV.zip

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          files: release/CB-to-MPV.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
