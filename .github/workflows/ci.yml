name: CI & Release

on:
  push:
    branches: [main, cb-player]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  # 手动触发跑的是同一条 release 流水线，但最后一步不发版：
  # 用它来验下载源、打包、发布目录完整性，不必为此先发布一个公开 Release
  workflow_dispatch:

jobs:
  # ── CI: 语法检查（push 到 main / cb-player，或 PR 到 main 时触发） ──
  # 第三方依赖只有 qrcode（画二维码矩阵用），见 requirements.txt
  lint:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 语法检查
        run: |
          python -m py_compile cb_to_mpv.pyw
          echo "All syntax checks passed."

      # 硬约束：Cookie 的值不许进 cb_to_mpv.log。测试自带桩件，不联网、不装依赖
      - name: Cookie 泄漏 canary 测试
        run: python test_cookie_canary.py

      # 打包后没有控制台，重复启动的提示只能靠原生对话框；这里盯它真的被调
      - name: 单实例提示测试
        run: python test_single_instance.py

  # ── Release: 推 tag 时自动打包 EXE + 发布；手动触发只打包不发版 ──
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PyInstaller 与运行依赖
        run: pip install pyinstaller -r requirements.txt

      - name: 打包 EXE
        env:
          SAFE_DELETE_DISABLE: "1"
        run: python -m PyInstaller --noconfirm cb_to_mpv.spec

      - name: 取 mpv 的 7z（多主机尝试 + 校验签名，绝不把 HTML 交给 7z）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          # 实测：runner 上 python urllib 请求 sourceforge.net 直接 403，
          # 而 Invoke-WebRequest 能拿到 200 —— 只是 200 给的是下载中转页（104 KB HTML）。
          # 所以这里用 IWR，但优先走 SourceForge 的脚本直连入口，并在解包前校验 7z 签名。
          $UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          $pinned = "mpv-x86_64-v3-20250223.7z"
          $magic = "55,122,188,175,39,28"
          $templates = @(
            "https://downloads.sourceforge.net/mpv-player-windows/64bit-v3/{0}",
            "https://master.dl.sourceforge.net/project/mpv-player-windows/64bit-v3/{0}",
            "https://sourceforge.net/projects/mpv-player-windows/files/64bit-v3/{0}/download"
          )

          # 固定包名可能已被清理，先列目录，把现存的日期包按新到旧排在后面
          $names = @($pinned)
          foreach ($p in @("https://sourceforge.net/rest/p/mpv-player-windows/files/64bit-v3/",
                           "https://sourceforge.net/projects/mpv-player-windows/files/64bit-v3/")) {
            try {
              $t = (Invoke-WebRequest -Uri $p -UserAgent $UA -TimeoutSec 120).Content
              $found = [regex]::Matches("$t", 'mpv-x86_64-v3-\d{8}') |
                       ForEach-Object { $_.Value } | Sort-Object -Unique -Descending
              Write-Host "LIST $($p.Substring(0,60)) -> $($found -join ', ')"
              foreach ($f in $found) { if ($names -notcontains "$f.7z") { $names += "$f.7z" } }
            } catch { Write-Host "LIST MISS $p :: $($_.Exception.Message)" }
          }

          $ok = $false
          foreach ($n in $names) {
            if ($ok) { break }
            foreach ($tpl in $templates) {
              $u = $tpl -f $n
              try {
                Invoke-WebRequest -Uri $u -OutFile mpv.7z -UserAgent $UA -TimeoutSec 900
              } catch { Write-Host "MISS $u :: $($_.Exception.Message)"; continue }
              # 用 Get-Item 的 FullName 读，别让 .NET 的进程 CWD 和 pwsh 的位置不一致
              $f = Get-Item "mpv.7z" -ErrorAction SilentlyContinue
              if (-not $f) { Write-Host "NOFILE $u"; continue }
              $sig = if ($f.Length -ge 6) {
                ((Get-Content $f.FullName -AsByteStream -TotalCount 6) -join ',') -eq $magic
              } else { $false }
              if ($sig -and ($f.Length -gt 1MB)) {
                Write-Host "HIT $u  $($f.Length) bytes"; $ok = $true; break
              }
              $head = -join ([char[]](Get-Content $f.FullName -AsByteStream -TotalCount 160))
              Write-Host "NOT7Z $u  len=$($f.Length) head=$($head -replace '\s+', ' ')"
            }
          }
          if (-not $ok) { Write-Error "no usable mpv 7z from any SourceForge path - fix the download source"; exit 1 }

      - name: 解包 mpv + 取 yt-dlp + 便携配置
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\CB-to-MPV\mpv-portable | Out-Null
          7z x mpv.7z -orelease\CB-to-MPV\mpv-portable -y
          Remove-Item mpv.7z
          # yt-dlp.exe（B 站 / YouTube 解析必需）
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile release\CB-to-MPV\mpv-portable\yt-dlp.exe
          # 便携 mpv 配置
          Copy-Item -Recurse mpv-portable\portable_config release\CB-to-MPV\mpv-portable\

      - name: 整理发布目录
        shell: pwsh
        run: |
          Copy-Item dist\CB-to-MPV.exe release\CB-to-MPV\
          # config.template.ini 是仓库内的配置模板，发布时改名为程序实际读取的 config.ini
          Copy-Item config.template.ini release\CB-to-MPV\config.ini
          # cookies.template.txt 是仓库内的空模板，发布时改名为程序实际读取的 cookies.txt
          Copy-Item cookies.template.txt release\CB-to-MPV\cookies.txt
          Copy-Item README.md release\CB-to-MPV\
          Copy-Item LICENSE release\CB-to-MPV\

      - name: 校验发布目录完整性
        shell: pwsh
        run: |
          $required = @(
            "release\CB-to-MPV\CB-to-MPV.exe",
            "release\CB-to-MPV\config.ini",
            "release\CB-to-MPV\cookies.txt",
            "release\CB-to-MPV\README.md",
            "release\CB-to-MPV\mpv-portable\mpv.exe",
            "release\CB-to-MPV\mpv-portable\yt-dlp.exe",
            "release\CB-to-MPV\mpv-portable\portable_config\mpv.conf",
            "release\CB-to-MPV\mpv-portable\portable_config\input.conf"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error "发布包缺少文件: $($missing -join ', ')"; exit 1 }
          Write-Host "发布包完整性校验通过 ($($required.Count) 项)"

      - name: 打包 zip
        run: Compress-Archive -Path release\CB-to-MPV\* -DestinationPath release\CB-to-MPV.zip

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          files: release/CB-to-MPV.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
