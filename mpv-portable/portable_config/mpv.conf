# ==============================================================================
# BiliYTPlayer — mpv 便携配置
# 通用版：自动适配所有 Windows 电脑的显示器硬件
# 针对 B 站 DASH 直链、杜比视界、高刷显示器优化
# ==============================================================================

# ── 视频输出（通用方案：DXGI 自动获取硬件参数）──────────────────────────────
vo=gpu-next
# GPU API：d3d11 兼容性最好，Intel/AMD/NVIDIA 全系驱动可用
gpu-api=d3d11
# gpu-context 默认 auto，d3d11 下自动选用 d3d11 上下文

# YouTube 画质：最高视频+最高音频分轨，回退合并流
ytdl-format=bestvideo+bestaudio/best

# ── HDR / Dolby Vision 色调映射（自动模式，适配所有用户电脑）───────────────
# 通用策略：不再按显示器型号写死条件，改为 mpv 通过 DXGI 自动读取硬件参数：
#   target-colorspace-hint=yes → mpv 读取显示器 EDID 自动判断是否支持 HDR，
#                                支持则输出 HDR 信号，不支持则自动回退 SDR
#   target-peak=auto          → 峰值亮度自动从显示器 EDID 获取，无需手动指定
#   hdr-compute-peak=yes      → 同时计算视频源场景峰值，两者互补
#   tone-mapping=spline       → 全局默认映射算法（高光过渡平滑）
target-colorspace-hint=yes
target-peak=auto
hdr-compute-peak=yes
tone-mapping=spline

# ═══════════════════════════════════════════════════════════════════════════
# 重要：显示器 EDID 虚标说明（出现画面异常时请阅读）
# ═══════════════════════════════════════════════════════════════════════════
# 部分 Windows 显示器的 EDID（硬件参数表）会虚标峰值亮度，导致以下现象：
#   - 画面发灰 / 整体暗淡 → EDID 标称峰值过低，mpv 把 HDR 内容映射到过低亮度
#   - 高光过曝 / 亮部发白 → EDID 标称峰值过高，mpv 按过高亮度映射丢失高光细节
# 如果遇到以上情况，说明你的显示器 EDID 虚标，请手动覆盖：
#   1. 取消下面一行的注释（去掉开头的 # 号）
#   2. 把 800 改为你显示器的真实峰值亮度（单位：nit）
#   3. 保存文件，重新打开播放器即可生效（无需重新打包）
# target-peak=800
# 参考值（按面板类型分档）：
#   WOLED 显示器（LG / 华硕 / 海盗船）   → 800-1000
#   QD-OLED 显示器（三星 / 外星人 / MSI）→ 800-1200
#   OLED 电视（中端，LG B/C 系列）       → 600-800
#   OLED 电视（高端 QD-OLED）            → 1200-1600
#   Mini-LED 显示器（中端）              → 800-1100
#   Mini-LED 显示器（高端 2000 级）      → 1200-1600
#   Mini-LED 电视（2200-5000 级）        → 1600-4000
# 拿不准时取低值更安全：欠曝（画面稍暗）比过曝（丢失高光细节）更容易接受。
# ═══════════════════════════════════════════════════════════════════════════

# 视频源层（通用，与显示器无关）：依据视频源自动切换映射算法
# HDR10 源（BT.2020 + PQ，含杜比视界经解码后的输出）→ spline
[HDR10]
profile-cond=get("video-params/primaries") == "bt.2020" and get("video-params/gamma") == "pq"
profile-restore=copy
tone-mapping=spline

# HLG 源（广电 / 日本 / 英国广播）→ bt.2390 更贴合广电 HLG 标准
[HLG]
profile-cond=get("video-params/primaries") == "bt.2020" and get("video-params/gamma") == "hlg"
profile-restore=copy
tone-mapping=bt.2390

# 图像质量
dither-depth=10
deband=yes
deband-iterations=3
deband-threshold=48
deband-range=16

# 硬件解码（auto-safe：自动选择无风险的后端，Windows 下通常为 d3d11va）
hwdec=auto-safe
hwdec-codecs=all

# ── 视频同步：audio 时钟比 display 时钟更适合 DASH 分离流 ──────────────────
# DASH 音视频来自不同 CDN URL，两个流的时钟天然有微小漂移。
# display-resample 强制对齐显示器 → 两个时钟打架 → 帧间卡顿。
# audio 模式让视频服从音频时钟，更稳定。
video-sync=audio
# 插帧需要完美稳定的源帧 → DASH 网络流不可控 → 关掉避免虚影/抖动
# interpolation=yes
# tscale=oversample
# 允许微量调整以保持音画同步
video-sync-max-video-change=3
video-sync-max-audio-change=0.05

# ── 音频 ─────────────────────────────────────────────────────────────────────
ao=wasapi
audio-exclusive=no
audio-channels=auto
# DASH 分离流网络缓冲：2 秒音频缓冲，扛网络抖动，避免爆音/无声
audio-buffer=2
# Dolby Atmos / E-AC-3 直通（如果音频设备支持）
# audio-spdif=ac3,eac3,dts,dts-hd,truehd
volume=100
volume-max=200

# ── 网络流缓冲（DASH 分离流：两个独立缓冲，不宜过大加重同步开销）───────────
cache=yes
cache-secs=10
demuxer-max-bytes=75M
demuxer-max-back-bytes=30M
# 不等待缓冲满就开播，边播边缓冲
# cache-pause-initial=yes
prefetch-playlist=yes

# ── 窗口行为 ─────────────────────────────────────────────────────────────────
keep-open=yes
keepaspect=yes
ontop=yes
# 窗口大小：默认 75% 屏幕
autofit-larger=75%x75%

# ── 字幕 / OSD ───────────────────────────────────────────────────────────────
sub-auto=fuzzy
sub-file-paths=subs:subtitles
# 显示当前时间 / 总时长
osd-duration=2000
osd-font-size=24
osd-bar-h=2
# 简洁模式：只显示时间
osd-playing-msg="${media-title}"
osd-level=1

# ── 截图 ─────────────────────────────────────────────────────────────────────
screenshot-format=png
screenshot-directory=~~desktop/
screenshot-high-bit-depth=yes
screenshot-tag-colorspace=yes

# ── 恢复播放位置（同文件不重复从头播）────────────────────────────────────────
save-position-on-quit=yes
# 但 B 站 CDN URL 是临时的，所以仅对本地文件生效
# （网络流靠文件名匹配，CDN URL 每次都不同，所以实际不会匹配）

# ── 日志 ─────────────────────────────────────────────────────────────────────
msg-level=all=status

# ==============================================================================
# 智能 WASAPI 音频自适应路由
# 依据「音轨编码 + 输出设备」自动切换独占 / 透传策略
# profile-cond 在 audio-codec-name / audio-device 属性变化时自动重新求值，
# 切歌 / 换设备无需任何手动干预。
# ==============================================================================

# ── 规则 1：Bit-Perfect —— 普通双声道音轨（FLAC / AAC / PCM / Opus / MP3）──
# 自动开启 WASAPI 独占：绕过 Windows 系统重采样，输出原始采样率 / 位深
# 注：Lua 的 string.match 不支持 | 交替语法，只能用多个 string.match 用 or 组合
[Audio-BitPerfect]
profile-cond=string.match(get("audio-codec-name", ""), "flac") ~= nil or string.match(get("audio-codec-name", ""), "aac") ~= nil or string.match(get("audio-codec-name", ""), "pcm") ~= nil or string.match(get("audio-codec-name", ""), "opus") ~= nil or string.match(get("audio-codec-name", ""), "vorbis") ~= nil or string.match(get("audio-codec-name", ""), "mp3") ~= nil
profile-restore=copy
audio-exclusive=yes

# ── 规则 2：源码透传 —— 杜比/DTS 音轨 + HDMI 功放 / 回音壁 ────────────────
# WASAPI 独占 + SPDIF 透传：把 Atmos / DTS:X 源码交给功放 / 回音壁解码
# 设备识别关键词：Display Audio（HDMI/DP 音频）、HDMI、S/PDIF、AVR、Soundbar 等
# 注："ac3" 子串同时覆盖 eac3，"dts" 覆盖 dtshd/dts_hd
[Audio-Passthrough]
profile-cond=(string.match(get("audio-codec-name", ""), "ac3") ~= nil or string.match(get("audio-codec-name", ""), "dts") ~= nil or string.match(get("audio-codec-name", ""), "truehd") ~= nil or string.match(get("audio-codec-name", ""), "mlp") ~= nil) and (string.match(get("audio-device", ""), "Display Audio") ~= nil or string.match(get("audio-device", ""), "HDMI") ~= nil or string.match(get("audio-device", ""), "S/PDIF") ~= nil or string.match(get("audio-device", ""), "Digital") ~= nil or string.match(get("audio-device", ""), "AVR") ~= nil or string.match(get("audio-device", ""), "Soundbar") ~= nil or string.match(get("audio-device", ""), "Receiver") ~= nil)
profile-restore=copy
audio-exclusive=yes
audio-spdif=ac3,eac3,dts,dts-hd,truehd

# ── 规则 3：Dolby Access 兼容 —— 杜比/DTS 音轨 + 普通耳机 / 板载声卡 ──────
# 关闭独占与透传：交给 Windows 的 Dolby Access 渲染空间音效（杜比全景声耳机版）
[Audio-DolbyAccess]
profile-cond=(string.match(get("audio-codec-name", ""), "ac3") ~= nil or string.match(get("audio-codec-name", ""), "dts") ~= nil or string.match(get("audio-codec-name", ""), "truehd") ~= nil or string.match(get("audio-codec-name", ""), "mlp") ~= nil) and string.match(get("audio-device", ""), "Display Audio") == nil and string.match(get("audio-device", ""), "HDMI") == nil and string.match(get("audio-device", ""), "S/PDIF") == nil and string.match(get("audio-device", ""), "Digital") == nil and string.match(get("audio-device", ""), "AVR") == nil and string.match(get("audio-device", ""), "Soundbar") == nil and string.match(get("audio-device", ""), "Receiver") == nil
profile-restore=copy
audio-exclusive=no
audio-spdif=no
